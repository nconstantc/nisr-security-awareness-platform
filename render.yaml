services:
  - type: web
    plan: free
    name: nisr-security-platform
    runtime: python3
    buildCommand: |
      echo "Installing dependencies..."
      pip install -r backend/requirements.txt
      echo "Running migrations..."
      cd backend && python manage.py migrate --noinput
      echo "Collecting static files..."
      cd backend && python manage.py collectstatic --noinput
      echo "Creating superuser..."
      cd backend && python manage.py createsuperuser --noinput || echo "Superuser creation skipped or already exists"
    startCommand: cd backend && gunicorn test_app:application --bind 0.0.0.0:10000 --log-level debug
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: true
      - key: DJANGO_ALLOWED_HOSTS
        value: nisr-security-platform.onrender.com,nisr-security-awareness-platform.onrender.com,localhost,127.0.0.1,0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: nisr-platform-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@nisr.gov.rw
      - key: DJANGO_SUPERUSER_PASSWORD
        value: NISR@2026Secure!
      - key: FIELD_ENCRYPTION_KEY
        value: Ll5NCMJhWO9Vfs9ZWT8fQRBKU-r_en5w4VzQc9FpP9Q=