services:
  - type: web
    plan: free
    name: nisr-security-platform
    runtime: python3
    buildCommand: |
      pip install -r requirements.txt
      cd backend && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: false
      - key: DJANGO_ALLOWED_HOSTS
        value: nisr-security-platform.onrender.com,nisr-security-awareness-platform.onrender.com,localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: nisr-platform-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0